name: Build

on:
  push:
    branches: [main, master, 'zayr/**']
    tags:
      - '*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Data test (map_data.json against romfs/100.sav)
        run: |
          g++ -std=c++17 -O2 -Wall -Iinclude tests/test_data.cpp -o test_data
          ./test_data

  build:
    runs-on: ubuntu-latest
    # zayr: pinned devkitPro image (same as Zayr64/botw-unexplored), so the build is reproducible
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: dkp-pacman -Q libnx devkitA64 switch-mesa switch-freetype switch-glm || true

      - name: Build
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: totk-unexplored.nro
          path: totk-unexplored.nro

  release:
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: totk-unexplored.nro

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: totk-unexplored.nro
          generate_release_notes: true
